<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spec Workflow 原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-950">
    <!-- Codex: 根据 openspec/changes/<change>/design.md 替换这个通用原型。保留 loading、empty、error、success 等状态，并确保无需 build step 即可检查。 -->
    <main class="mx-auto max-w-6xl px-6 py-8">
      <header class="mb-6 border-b border-slate-200 pb-4">
        <p class="text-sm font-medium text-cyan-700">OpenSpec 原型</p>
        <h1 class="mt-2 text-3xl font-semibold">Change 标题</h1>
      </header>

      <section class="grid gap-4 md:grid-cols-4">
        <article class="rounded-md border border-slate-200 bg-white p-4">
          <h2 class="text-sm font-semibold">Loading</h2>
          <div class="mt-4 h-2 rounded bg-slate-200">
            <div class="h-2 w-2/3 rounded bg-cyan-600"></div>
          </div>
        </article>
        <article class="rounded-md border border-slate-200 bg-white p-4">
          <h2 class="text-sm font-semibold">Empty</h2>
          <p class="mt-3 text-sm text-slate-600">暂无记录。</p>
        </article>
        <article class="rounded-md border border-red-200 bg-white p-4">
          <h2 class="text-sm font-semibold text-red-700">Error</h2>
          <p class="mt-3 text-sm text-slate-600">可重试失败提示。</p>
        </article>
        <article class="rounded-md border border-emerald-200 bg-white p-4">
          <h2 class="text-sm font-semibold text-emerald-700">Success</h2>
          <p class="mt-3 text-sm text-slate-600">完成状态摘要。</p>
        </article>
      </section>

      <section class="mt-6 rounded-md border border-slate-200 bg-white p-5">
        <h2 class="text-lg font-semibold">主流程</h2>
        <div class="mt-4 grid gap-3 md:grid-cols-3">
          <button class="rounded-md bg-cyan-700 px-4 py-2 text-sm font-medium text-white">主要操作</button>
          <button class="rounded-md border border-slate-300 px-4 py-2 text-sm font-medium">次要操作</button>
          <button class="rounded-md border border-slate-300 px-4 py-2 text-sm font-medium" disabled>不可用</button>
        </div>
      </section>
    </main>
  </body>
</html>
