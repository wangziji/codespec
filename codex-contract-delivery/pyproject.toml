[project]
name = "codex-contract-delivery"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.25,<5",
]

[project.scripts]
cdd = "codex_contract_delivery.cli:main"

[dependency-groups]
test = [
  "pytest>=8.0,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_contract_delivery"]
